{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveOn | Sign In</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=7">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top navbar-enhanced">

        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="{% url 'index' %}">

                <img
                    src="{% static 'image/logo.png' %}"
                    alt="DriveOn Logo"
                    class="navbar-logo">

                <span class="navbar-brand-text">
                    DRIVE<span>ON</span>
                </span>

            </a>

            <button
                class="navbar-toggler navbar-toggler-modern"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

                <span></span>
                <span></span>
                <span></span>

            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav mx-auto navbar-links">

                    <li class="nav-item">
                        <a class="nav-link nav-link-enhanced" href="{% url 'index' %}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav-link-enhanced" href="{% url 'cars' %}">
                            Cars
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav-link-enhanced" href="{% url 'about' %}">
                            About Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav-link-enhanced" href="{% url 'contact' %}">
                            Contact
                        </a>
                    </li>

                </ul>

                <div class="navbar-actions">

                    <a href="{% url 'login' %}" class="btn btn-signin">
                        Sign In
                    </a>

                    <a href="{% url 'reservation' %}" class="btn btn-gold btn-reserve">
                        <i class="fas fa-calendar-check"></i>
                        <span>Reserve Now</span>
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- LOGIN -->
    <main>

        <section class="py-5">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-12 col-md-8 col-lg-5">

                        <div class="login-card">

                            <!-- HEADER -->
                            <div class="text-center">

                                <p>
                                    Welcome Back
                                </p>

                                <h1>
                                    Sign In
                                </h1>

                                <p>
                                    Sign in to your DriveOn account.
                                </p>

                            </div>


                            <!-- FORM -->
                            <form>

                                <!-- EMAIL -->
                                <div class="mb-3">

                                    <label for="email" class="form-label">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Enter your email">

                                </div>


                                <!-- PASSWORD -->
                                <div class="mb-3">

                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Enter your password">

                                </div>


                                <!-- OPTIONS -->
                                <div class="d-flex justify-content-between align-items-center mb-4">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="remember">

                                        <label
                                            class="form-check-label"
                                            for="remember">
                                            Remember me
                                        </label>

                                    </div>

                                    <a href="#">
                                        Forgot Password?
                                    </a>

                                </div>


                                <!-- SIGN IN BUTTON -->
                                <div class="d-grid">

                                    <button
                                        type="submit"
                                        class="btn btn-gold">
                                        Sign In
                                    </button>

                                </div>

                            </form>


                            <!-- REGISTER -->
                            <div class="text-center mt-4">

                                <p>
                                    Don't have an account?
                                </p>

                                <a href="{% url 'login' %}">
                                    Create an Account
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    

    <script src="{% static 'js/script.js' %}?v=6"></script>

</body>

</html>
