{% load i18n %}{% get_current_language as LANG %}
{# Tekstet për JavaScript-in (kalendari, përmbledhja, mesazhet) në gjuhën aktuale #}
<script>
window.I18N = {
    lang: "{{ LANG }}",
    selectPickup: "{% translate 'Select pickup date' %}",
    selectReturn: "{% translate 'Select return date' %}",
    thenReturn: "{% translate 'Then choose the return date' %}",
    pickupOn: "{% translate 'Pickup: {date}' %}",
    day: "{% translate 'day' %}",
    days: "{% translate 'days' %}",
    perDay: "{% translate '/ day' %}",
    seats: "{% translate '{n} seats' %}",
    noCar: "{% translate 'No car selected' %}",
    dailyRate: "{% translate 'Daily rate' %}",
    chooseDates: "{% translate 'Choose your dates' %}",
    bookedFromTo: "{% translate 'This car is booked from {start} to {end}. Please choose different dates.' %}",
    bookedOnDates: "{% translate 'This car is booked on the selected dates.' %}",
    selectCar: "{% translate 'Please select a car.' %}",
    selectLocation: "{% translate 'Please select a pickup location.' %}",
    selectDates: "{% translate 'Please select your dates.' %}",
    returnAfter: "{% translate 'The return date must be after the pickup date.' %}",
    from: "{% translate 'From' %}",
    total: "{% translate 'total' %}",
    continueLabel: "{% translate 'Continue' %}",
    checkDates: "{% translate 'Check dates' %}",
};
window.I18N.fmt = (s, ...args) => args.reduce((out, a) => out.replace(/\{\w+\}/, a), s);
window.I18N.plural = (n) => `${n} ${n === 1 ? window.I18N.day : window.I18N.days}`;
</script>
