{% load i18n %}{# Formulari i kërkimit (vendi + datat). Përdoret në faqen kryesore dhe te Cars. #}
<form class="trip-search" method="get" action="{% url 'cars' %}" novalidate>
    <div class="trip-search-field">
        <label for="tripLocation">{% translate "Pickup location" %}</label>
        <select id="tripLocation" name="pickup_location" class="form-select">
            {% for loc in locations %}
            <option value="{{ loc }}" {% if trip.location == loc %}selected{% endif %}>{{ loc }}</option>
            {% endfor %}
        </select>
    </div>
    {# vlerat YYYY-MM-DD shkojnë te Django; fushat e dukshme hapin kalendarin me interval #}
    <input type="hidden" id="tripPickup" name="pickup_date" value="{{ trip.start|date:'Y-m-d' }}">
    <input type="hidden" id="tripReturn" name="return_date" value="{{ trip.end|date:'Y-m-d' }}">
    <div class="trip-search-field">
        <label for="tripPickupAlt">{% translate "Pickup date" %}</label>
        <input type="text" id="tripPickupAlt" class="form-control" placeholder="{% translate 'Add date' %}" autocomplete="off" inputmode="none">
    </div>
    <div class="trip-search-field">
        <label for="tripReturnAlt">{% translate "Return date" %}</label>
        <input type="text" id="tripReturnAlt" class="form-control" placeholder="{% translate 'Add date' %}" autocomplete="off" inputmode="none">
    </div>
    <button type="submit" class="btn btn-gold trip-search-btn">{% if button %}{{ button }}{% else %}{% translate "Find a car" %}{% endif %}</button>
</form>
