{# Formulari i kërkimit (vendi + datat). Përdoret në faqen kryesore dhe te Cars. #}
<form class="trip-search" method="get" action="{% url 'cars' %}" novalidate>
    <div class="trip-search-field">
        <label for="tripLocation">Pickup location</label>
        <select id="tripLocation" name="pickup_location" class="form-select">
            {% for loc in locations %}
            <option value="{{ loc }}" {% if trip.location == loc %}selected{% endif %}>{{ loc }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="trip-search-field">
        <label for="tripPickupAlt">Pickup date</label>
        <input type="text" id="tripPickup" name="pickup_date" class="form-control" placeholder="Add date"
               value="{{ trip.start|date:'Y-m-d' }}" autocomplete="off">
    </div>
    <div class="trip-search-field">
        <label for="tripReturnAlt">Return date</label>
        <input type="text" id="tripReturn" name="return_date" class="form-control" placeholder="Add date"
               value="{{ trip.end|date:'Y-m-d' }}" autocomplete="off">
    </div>
    <button type="submit" class="btn btn-gold trip-search-btn">{{ button|default:"Find a car" }}</button>
</form>
